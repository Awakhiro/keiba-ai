name: Cloudflare Pages に公開（任意）

# private リポジトリのまま予想ページを URL で見たい場合に使う。
# 使う前に Cloudflare のダッシュボードで Pages プロジェクトを作り、
# リポジトリの Settings → Secrets に次の3つを登録すること:
#   CLOUDFLARE_API_TOKEN   （Cloudflare Pages の編集権限）
#   CLOUDFLARE_ACCOUNT_ID
#   CF_PROJECT_NAME        （Pages プロジェクト名）
on:
  workflow_run:
    workflows: ["学習と予想の公開"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: 設定確認
        id: cfg
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Cloudflare の設定がないのでスキップします。" >> $GITHUB_STEP_SUMMARY
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ ! -f docs/index.html ]; then
            echo "docs/index.html がまだありません。" >> $GITHUB_STEP_SUMMARY
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: デプロイ
        if: steps.cfg.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=${{ secrets.CF_PROJECT_NAME }}
