name: データ収集

# 手動実行と、6時間ごとの自動実行。
# 1回の実行で集めきれなくても、次の実行が続きから再開する。
on:
  workflow_dispatch:
    inputs:
      start:
        description: "収集開始日"
        default: "2025-01-01"
      end:
        description: "収集終了日（空欄なら今日まで）"
        default: ""
      minutes:
        description: "1回あたりの実行時間(分)"
        default: "300"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: 収集
        id: scrape
        run: |
          # 終了日を省略したら今日まで。定期実行でも新しいレースが自動で入る。
          END="${{ inputs.end }}"
          END="${END:-$(date -u +%Y-%m-%d)}"
          echo "収集範囲の終わり: $END"
          python -u scripts/scrape_chunk.py \
            --start "${{ inputs.start || '2025-01-01' }}" \
            --end   "$END" \
            --minutes "${{ inputs.minutes || '300' }}" \
            && echo "complete=true" >> $GITHUB_OUTPUT \
            || { c=$?; [ $c -eq 75 ] && echo "complete=false" >> $GITHUB_OUTPUT || exit $c; }

      - name: 保存
        run: |
          BRANCH="${{ github.event.repository.default_branch }}"
          BRANCH="${BRANCH:-main}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ || { echo "data がありません"; exit 0; }
          git diff --staged --quiet && echo "変更なし" && exit 0
          git commit -m "データ収集 $(date -u +%Y-%m-%dT%H:%M)"
          # detached HEAD でも確実に動くよう、ブランチ名を明示して push する
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH" || git rebase --abort
          git push origin "HEAD:$BRANCH"

      - name: モデルの更新が必要か
        if: steps.scrape.outputs.complete == 'true'
        run: |
          # 学習データが増えたので、次の予想実行で学習し直される。
          # （data/models の指紋が合わなくなるため自動で再学習される）
          echo "データが更新されました。次の予想実行で学習し直されます。" \
            >> $GITHUB_STEP_SUMMARY

      - name: 進捗
        run: |
          if [ "${{ steps.scrape.outputs.complete }}" = "true" ]; then
            echo "### 収集完了" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 途中まで完了。次回の実行で続きから。" >> $GITHUB_STEP_SUMMARY
          fi
          python -c "import json;s=json.load(open('data/state.json'));print('収集済み開催日',len(s['done_dates']))" >> $GITHUB_STEP_SUMMARY
