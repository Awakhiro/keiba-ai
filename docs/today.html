<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E7DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>予想</title>
<style>
:root{
  --paper:#E9E7DF; --card:#F4F2EB; --ink:#22252A; --muted:#71767D;
  --rule:#C9C6BB; --shu:#B5301E; --ai:#1F4E79; --ok:#1D6E45;
  --f1:#FFFFFF; --f2:#1A1A1A; --f3:#D0342C; --f4:#2565C7;
  --f5:#EFC126; --f6:#1D8A50; --f7:#EA7A22; --f8:#F0A6B8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  font-size:15px; line-height:1.55;
  font-feature-settings:"palt" 1; font-variant-numeric:tabular-nums;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- 見出し ---------- */
header{padding:22px 0 14px;border-bottom:2px solid var(--ink)}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.16em;line-height:1}
.sub{margin-top:7px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.count{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- 絞り込み ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);padding:9px 0 10px}
.row{display:flex;gap:6px;align-items:center}
.row + .row{margin-top:7px}
.lab{font-size:11px;color:var(--muted);width:38px;flex:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:2px;
  padding:5px 11px;font-size:13px;line-height:1.2;transition:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.rhead:focus-visible,.tab:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.seg{display:flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden;flex:1}
.seg button{flex:1;padding:6px 4px;font-size:13px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:first-child[aria-pressed="true"]{background:var(--shu);border-color:var(--shu)}
.seg button:last-child[aria-pressed="true"]{background:var(--ai)}

/* ---------- レース ---------- */
.race{border-bottom:1px solid var(--rule);padding:0}
.rhead{display:flex;width:100%;align-items:flex-start;gap:11px;
  padding:14px 0 13px;text-align:left}
.stamp{flex:none;width:38px;height:38px;border:2px solid var(--shu);color:var(--shu);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;border-radius:50%;margin-top:2px}
.stamp.g-A{border-color:var(--ink);color:var(--ink)}
.stamp.g-B{border-color:var(--muted);color:var(--muted);border-width:1px}
.stamp.g-C{border-color:var(--rule);color:var(--muted);border-width:1px}
.rtitle{font-size:17px;font-weight:700;letter-spacing:.02em}
.rmeta{font-size:12px;color:var(--muted);margin-top:2px}
.conf{margin-top:6px;display:flex;align-items:center;gap:7px}
.gauge{flex:1;height:3px;background:var(--rule);max-width:130px}
.gauge i{display:block;height:100%;background:var(--shu)}
.confnum{font-size:11px;color:var(--muted)}
.caret{margin-left:auto;flex:none;color:var(--muted);font-size:12px;padding-top:12px}

.body{display:none;padding-bottom:18px}
.race.open .body{display:block}

/* ---------- 出馬表 ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{font-size:10px;color:var(--muted);font-weight:400;text-align:right;
  padding:0 0 4px;border-bottom:1px solid var(--rule)}
thead th:nth-child(1),thead th:nth-child(2){text-align:left}
td{padding:6px 0;border-bottom:1px solid rgba(201,198,187,.5)}
td:not(:first-child):not(:nth-child(2)){text-align:right}
tr.top td{background:rgba(181,48,30,.05)}
.mark{width:22px;font-size:17px;font-weight:700;color:var(--shu)}
.b .mark{color:var(--ai)}
.uma{display:flex;align-items:center;gap:7px}
.fr{width:21px;height:21px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;border:1px solid rgba(0,0,0,.28)}
.hn{font-size:13px}
.pv{font-variant-numeric:tabular-nums}
.dim{color:var(--muted);font-size:12px}
.pos{color:var(--ok);font-weight:700}
.gap{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0}
.fin{display:inline-block;min-width:19px;text-align:center;font-size:11px;font-weight:700;
  border:1px solid var(--rule);color:var(--muted);margin-left:5px;padding:0 2px}
.fin.p1{background:var(--shu);color:#fff;border-color:var(--shu)}
.fin.p2,.fin.p3{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.res{font-size:11px;font-weight:700;padding:2px 7px;border:1px solid;margin-left:8px}
.res.hit{color:var(--ok);border-color:var(--ok)}
.res.miss{color:var(--muted);border-color:var(--rule)}
.buy li.win{background:rgba(29,110,69,.09)}

/* ---------- おすすめ ---------- */
.rec{border:2px solid var(--ink);padding:12px 13px 11px;margin:14px 0 4px}
.rec.b{border-color:var(--ai)}
.rec.skip{border-style:dashed;border-color:var(--rule)}
.rec-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.rec-type{font-size:19px;font-weight:800;letter-spacing:.04em}
.rec-pts{font-size:13px;color:var(--muted)}
.rec-shape{font-size:12px;color:var(--muted);margin-left:auto}
.rec-combos{margin:10px 0 9px;display:flex;flex-direction:column;gap:5px}
.rec-line{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700}
.rec-line .sep{font-weight:400}
.rec-nums{font-size:12px;color:var(--muted);margin-left:auto;font-weight:400}
.rec-stats{display:flex;gap:15px;font-size:11px;color:var(--muted);
  border-top:1px solid var(--rule);padding-top:8px}
.rec-stats b{display:block;font-size:15px;color:var(--ink);font-weight:700;line-height:1.3}
.rec-why{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.6}
.rec-alt{font-size:11px;color:var(--muted);margin-top:5px}

/* ---------- 買い目 ---------- */
.tabs{display:flex;gap:0;margin:16px 0 0;border-bottom:1px solid var(--rule)}
.tab{padding:7px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.sum{display:flex;gap:16px;margin:11px 0 9px;font-size:12px;color:var(--muted)}
.sum b{display:block;font-size:17px;color:var(--ink);font-weight:700;line-height:1.2}
.sum b.good{color:var(--ok)} .sum b.bad{color:var(--shu)}
.buy{list-style:none;margin:0;padding:0}
.buy li{display:flex;align-items:center;gap:9px;padding:6px 0;
  border-bottom:1px solid rgba(201,198,187,.5);font-size:14px}
.combo{font-weight:700;letter-spacing:.03em;flex:1}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  padding:0 3px;font-size:12px;font-weight:700;border:1px solid rgba(0,0,0,.28);margin-right:2px}
.sep{color:var(--muted);font-weight:400;margin:0 3px}
.empty{padding:16px 2px;font-size:13px;color:var(--muted);line-height:1.7}
footer{padding:26px 0 40px;font-size:11px;color:var(--muted);line-height:1.8}
@media (prefers-reduced-motion:no-preference){.race.open .body{animation:o .16s ease-out}}
@keyframes o{from{opacity:0}to{opacity:1}}
</style>
</head>

const FRAME = {1:'var(--f1)',2:'var(--f2)',3:'var(--f3)',4:'var(--f4)',5:'var(--f5)',6:'var(--f6)',7:'var(--f7)',8:'var(--f8)'};
const DARK = {2:true,3:true,4:true,6:true};
let grade='all', model='A';
const openSet = new Set();
const tabState = {};
const ORD = {S:3,A:2,B:1,C:0};

const pct = v => (v*100).toFixed(1)+'%';

function frameChip(fr,no){
  const bg = FRAME[fr]||'#fff';
  const col = DARK[fr] ? '#fff' : '#1A1A1A';
  return `<span class="fr" style="background:${bg};color:${col}">${no}</span>`;
}

function horseRows(r){
  const key = model==='A' ? 'pA' : 'pB';
  const mk  = model==='A' ? 'markA' : 'markB';
  const hasFin = r.horses.some(h=>h.fin);
  const fh = hasFin ? '<th>着</th>' : '';
  const head = model==='A'
    ? `<tr><th>印</th><th>馬</th><th>3着内</th><th>単勝</th>${fh}</tr>`
    : `<tr><th>印</th><th>馬</th><th>勝率</th><th>単勝</th><th>妙味</th>${fh}</tr>`;
  const rows = r.horses.map(h=>{
    const hot = h[mk]==='◎'||h[mk]==='○';
    // 妙味 = 能力から見た評価 ÷ 市場の評価。1.25以上なら人気が想定より低い
    const val = (h.edge == null) ? h.ev : h.edge;
    const hot2 = h.edge != null && h.edge >= 1.25 && h.gap >= 1;
    const ev = model==='B'
      ? `<td class="pv ${hot2 ? 'pos':'dim'}">${val.toFixed(2)}${
          hot2 && h.gap ? `<span class="gap">人気${h.gap}枚下</span>` : ''}</td>` : '';
    return `<tr class="${hot?'top':''}">
      <td class="mark">${h[mk]}</td>
      <td><span class="uma">${frameChip(h.frame,h.no)}<span class="hn">${h.name}</span></span></td>
      <td class="pv">${pct(h[key])}</td>
      <td class="pv dim">${h.odds.toFixed(1)}</td>${ev}
      ${h.fin ? `<td><span class="fin p${h.fin<=3?h.fin:''}">${h.fin}</span></td>`:''}</tr>`;
  }).join('');
  return `<table class="${model==='B'?'b':''}"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

function recSection(r){
  const rec = r.recommend && r.recommend[model];

    }).join(sep);

    ? `<div class="rec-alt">次点: ${rec.alts.map(a=>
        `${a.type}${a.points}点（的中${(a.p*100).toFixed(0)}%）`).join('　')}</div>` : '';
  return `<div class="${cls}">
    <div class="rec-top"><span class="rec-type">${rec.type}</span>
      <span class="rec-pts">${rec.points}点</span>${badge}
      <span class="rec-shape">${rec.shape}</span></div>
    <div class="rec-combos">${lines}</div>
    <div class="rec-stats">
      <div><b>${(rec.p*100).toFixed(0)}%</b>的中率</div>
      <div><b>${rec.odds.toFixed(1)}倍</b>合成オッズ</div>
      <div><b>${(rec.ret*100).toFixed(0)}%</b>期待回収率</div>
    </div>
    ${rec.real_odds ? '' : '<div class="rec-why">配当は単勝オッズからの推定です。</div>'}
    ${alts}</div>`;
}

function buySection(r){
  const types = DATA.bet_types;
  const cur = tabState[r.race_id] || types[0];
  const tabs = types.map(t=>{
    const st = r.bets[model][t] && r.bets[model][t].result;
    const dot = st==='hit' ? '<span class="pos"> ●</span>' : '';
    return `<button class="tab" data-race="${r.race_id}" data-t="${t}" aria-pressed="${t===cur}">${t}${dot}</button>`;
  }).join('');
  const set = r.bets[model][cur];
  let inner;
  if(!set || set.points.length===0){
    inner = model==='B'
      ? `<div class="empty">${cur}で期待値が基準を超える組み合わせがありません。このレースの${cur}は見送り。「当てにいく」に切り替えると的中率重視の買い目が出ます。</div>`
      : `<div class="empty">${cur}の買い目はありません。</div>`;
  } else {
    const s = set.summary;
    const ret = s['期待回収率'];
    const cls = ret>=1 ? 'good' : (ret<0.8 ? 'bad':'');
    inner = `<div class="sum">
        <div><b>${s['点数']}</b>点</div>
        <div><b>${pct(s['的中確率'])}</b>的中率</div>
        <div><b class="${cls}">${(ret*100).toFixed(0)}%</b>期待回収率</div>
        <div style="margin-left:auto;align-self:center">${badge}</div>
      </div>
      <ul class="buy">${set.points.map(p=>{
        const nums = p.combo.map(n=>{
          const h = r.horses.find(x=>x.no===n);
          return frameChip(h?h.frame:1, n);
        }).join(cur.includes('単') ? '<span class="sep">→</span>' : '<span class="sep">−</span>');
        return `<li class="${p.hit?'win':''}"><span class="combo">${nums}</span>
          <span class="pv dim">${pct(p.p)}</span>
          <span class="pv">${p.odds.toFixed(1)}倍</span>
          <span class="pv ${p.ev>=1?'pos':'dim'}">${p.ev.toFixed(2)}</span></li>`;
      }).join('')}</ul>`;
  }
  return `<div class="tabs">${tabs}</div>${inner}`;
}

function raceCard(r){
  const open = openSet.has(r.race_id);
  const title = `${r.venue}${r.race_no?' '+r.race_no+'R':''}`;
  const t = r.post_time ? r.post_time+'発走　' : '';
  const meta = `${t}${r.surface}${r.distance}m　${r.field_size}頭　${r.agree?'両モデル一致':'モデル割れ'}`;
  return `<section class="race ${open?'open':''}" data-race="${r.race_id}">
    <button class="rhead" data-race="${r.race_id}" aria-expanded="${open}">
      <span class="stamp g-${r.grade}">${r.grade}</span>
      <span>
        <span class="rtitle">${title}</span>
        <div class="rmeta">${meta}</div>
        <div class="conf"><span class="gauge"><i style="width:${r.conf}%"></i></span>
          <span class="confnum">自信度 ${r.conf}</span></div>
      </span>
      <span class="caret">${open?'閉じる':'開く'}</span>
    </button>
    <div class="body">${open ? recSection(r)+horseRows(r)+buySection(r) : ''}</div>
  </section>`;
}

function render(){
  const races = DATA.races.filter(r => grade==='all' || ORD[r.grade]>=ORD[grade]);
  document.getElementById('list').innerHTML =
    races.length ? races.map(raceCard).join('')
    : `<div class="empty">この格付けに該当するレースがありません。条件をゆるめてください。</div>`;
  const m = DATA.meta||{};
  document.getElementById('sub').textContent =
    [m.date, m.venues].filter(Boolean).join('　') || DATA.generated_at;
  document.getElementById('count').textContent =
    `${races.length}レース表示中　更新 ${DATA.generated_at}`;
}

document.addEventListener('click', e=>{
  const chip = e.target.closest('.chip[data-g]');
  if(chip){ grade = chip.dataset.g;
    document.querySelectorAll('.chip[data-g]').forEach(c=>
      c.setAttribute('aria-pressed', String(c===chip)));
    render(); return; }

  const seg = e.target.closest('.seg button');
  if(seg){ model = seg.dataset.m;
    document.querySelectorAll('.seg button').forEach(b=>
      b.setAttribute('aria-pressed', String(b===seg)));
    render(); return; }

  const tab = e.target.closest('.tab');
  if(tab){ tabState[tab.dataset.race] = tab.dataset.t; render(); return; }

  const head = e.target.closest('.rhead');
  if(head){ const id = head.dataset.race;
    openSet.has(id) ? openSet.delete(id) : openSet.add(id);
    render(); return; }
});

if(DATA && DATA.races){ render(); }
else{ document.getElementById('list').innerHTML =
  '<div class="empty">データが埋め込まれていません。build_site.py を実行してください。</div>'; }
</script>
</body>
</html>
